# mmkb 本地一键启动：API + Streamlit 前端。
#
# 使用：
#   cp .env.example .env      # 填入 LLM / Embedding / Rerank 的 Key
#   docker compose up --build
#
# 前端 http://localhost:8501 · API 文档 http://localhost:8000/docs
#
# 注意：只有 api 服务读 .env。前端不需要任何模型密钥，
# 把密钥传给前端容器只会扩大泄露面。

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mmkb:0.1.0
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
    env_file:
      - .env
    environment:
      # 显式固定容器内路径，避免宿主机 .env 里的相对路径产生歧义
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      # 文档、SQLite、Chroma、图片、BM25 索引、评测产物都在这一个目录下
      - ./data:/app/data
    healthcheck:
      # /api/health 永远返回 200（即使未配置密钥），适合做存活探针；
      # /api/health/ready 在缺 Key 时返回 503，不适合决定容器要不要启动。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: mmkb:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - streamlit
      - run
      - frontend/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      # 容器内访问 API 走服务名
      MMKB_API_BASE: http://api:8000
      # 图片 URL 由**浏览器**加载，必须用宿主机可达地址。
      # 换端口/部署到服务器时改这里（或用 MMKB_PUBLIC_BASE 覆盖）。
      MMKB_PUBLIC_BASE: http://localhost:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
